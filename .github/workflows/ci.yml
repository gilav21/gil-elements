name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check
      - run: node parity/run.mjs
      - name: Keep the parity images of the differing cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-diffs
          path: parity/out/*.png
          if-no-files-found: ignore
          retention-days: 7

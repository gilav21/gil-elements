# Local SonarQube scan config. Run with `pnpm run sonar` (runs the tests with coverage first; needs Docker, a server at localhost:9000 and SONAR_TOKEN).
sonar.projectKey=gil-elements
sonar.projectName=gil-elements

# Sources are named, not `.`: the scanner walks everything under sonar.sources before applying exclusions.
sonar.sources=packages/base/src,packages/elements/src,apps/demo/src,scripts
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.config.ts,\
  **/*.d.ts
# Locale dictionaries (including the rich-text-editor `locales/` folder and addon `*-locale.ts` tables) repeat the same key
# structure per language on purpose.
sonar.cpd.exclusions=**/*locales*.ts,**/locales/*.ts,**/*-locale.ts,**/*-fixtures.ts
sonar.typescript.tsconfigPaths=packages/base/tsconfig.json,packages/elements/tsconfig.json,apps/demo/tsconfig.json
sonar.sourceEncoding=UTF-8
# Written by `pnpm run test:coverage` (vitest v8 coverage); `pnpm run sonar` runs it first.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# S4624 (nested template literals) fires on every `html`...`${cond ? html`...` : nothing}` in a Lit template, which is how
# conditional rendering is written in Lit. Nothing is concatenated into a string there, so it is not the smell the rule
# targets. See docs/sonarqube-accepted-findings.md.
# e2: the rich text editor formats a contenteditable through document.execCommand/queryCommandState, the only API for it.
# e3-e5: long-standing false positives (casts or typeof guards that cannot be removed).
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S4624
sonar.issue.ignore.multicriteria.e1.resourceKey=packages/**/*.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.e2.resourceKey=packages/elements/src/rich-text-editor/**
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S4325
sonar.issue.ignore.multicriteria.e3.resourceKey=packages/elements/src/sortable/sortable.ts
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S4325
sonar.issue.ignore.multicriteria.e4.resourceKey=packages/elements/src/radio-group/radio-group.ts
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S7741
sonar.issue.ignore.multicriteria.e5.resourceKey=packages/elements/src/file-viewer/parsers/pdf-pixel-perfect.ts
# e6: listener snapshots must survive a listener that unsubscribes or subscribes while the loop runs.
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S7747
sonar.issue.ignore.multicriteria.e6.resourceKey=packages/elements/src/rich-text-editor/rich-text-registry.ts
# e7: syncAddons deletes covered addons from `wanted` while walking it, so the walk needs a snapshot.
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S7747
sonar.issue.ignore.multicriteria.e7.resourceKey=packages/elements/src/rich-text-editor/rich-text-editor.ts


<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gil Elements</title>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" id="sidebar" aria-label="Components">
        <a class="brand" href="#top"><strong>Gil Elements</strong><span>Lit web components</span></a>
        <nav id="nav"></nav>
      </aside>
      <div class="main">
        <header class="topbar">
          <ge-button variant="ghost" size="icon" id="menu" aria-label="Toggle navigation" aria-expanded="false">☰</ge-button>
          <div class="controls">
            <div class="density">
              <span id="density-label">Density</span>
              <div class="density-field"><ge-slider id="density" aria-labelledby="density-label" min="0.75" max="1.25" step="0.125" value="1"></ge-slider></div>
              <output id="density-out">1</output>
            </div>
            <ge-button variant="outline" size="sm" id="rtl" aria-pressed="false">RTL</ge-button>
            <ge-button variant="outline" size="sm" id="theme" aria-pressed="false">Dark</ge-button>
          </div>
        </header>
        <main id="content"></main>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
